<mat-toolbar class="liveprint-toolbar">
  <!-- <mat-icon class="brand-icon" aria-hidden="true">directions_run</mat-icon> -->
  <img class="brand-icon" aria-hidden="true" src="../../assets/logo.svg" />
  <span class="app-name">{{ appName() }}</span>
  <span class="spacer"></span>
  <button
    mat-icon-button
    [matMenuTriggerFor]="menu"
    matTooltip="Περισσότερα"
    aria-label="Περισσότερες επιλογές"
  >
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item (click)="onSettingsClicked()">
      <mat-icon>settings</mat-icon>
      <span>Ρυθμίσεις</span>
    </button>
    <button mat-menu-item (click)="onLogoutClicked()">
      <mat-icon>logout</mat-icon>
      <span>Αποσύνδεση</span>
    </button>
  </mat-menu>
</mat-toolbar>
